[package]
name = "runner"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
uiua = { version = "0.19", default-features = false, features = ["opt", "web"] }
wasm-bindgen = "=0.2.108"

[dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

# The uiua crate reads these web-sys features from this workspace's own
# dependency declaration via Cargo's feature unification; uiua's own
# Cargo.toml only marks web-sys as optional without selecting features.
[dependencies.web-sys]
version = "0.3.70"
features = [
  "Clipboard",
  "ClipboardEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "DomRect",
  "EventInit",
  "File",
  "FileList",
  "FileReader",
  "HtmlAudioElement",
  "HtmlBrElement",
  "Navigator",
  "Node",
  "Performance",
  "Permissions",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "Selection",
  "Storage",
  "StorageManager",
]
