# Rebuilds the static site whenever a push to main (including merged PRs) modifies exercises
name: Build site

on:
  push:
    branches: ["main"]
    paths:
      - "exercises/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialize builds so concurrent merges don't race when pushing
concurrency:
  group: "build-site"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            web/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('web/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build site
        run: ./web/build.sh

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A web/dist
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild site for ${GITHUB_SHA::7}"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref ${{ github.ref_name }}
